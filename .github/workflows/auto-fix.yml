name: Auto-fix

# Triggered by a human commenting /auto-fix. Applies only the mechanical fix - the
# modification notice, whose content is always the same string. It deliberately does
# NOT touch new files: the right copyright holder there depends on where the content
# came from, and a machine guessing that is how someone else's work ends up carrying
# yours.
#
# Anyone with write access may trigger this, author included. That is the difference
# between this and the replacement disposition: a mechanical fix carries no judgement,
# so it needs no independent signatory.

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write

jobs:
  fix:
    if: github.event.issue.pull_request && contains(github.event.comment.body, '/auto-fix')
    runs-on: ubuntu-latest
    concurrency:
      group: autofix-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - name: Check the commenter may do this
        id: auth
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const who = context.payload.comment.user.login;
            // author_association reports organisation membership, not access to this
            // repository. Authorise against the collaborator permission API instead.
            let perm = 'none';
            try {
              const r = await github.rest.repos.getCollaboratorPermissionLevel(
                {owner, repo, username: who});
              perm = r.data.permission;
            } catch (e) { perm = 'none'; }
            if (!['admin', 'write', 'maintain'].includes(perm)) {
              // Ignored in silence. Replying would confirm to someone probing that the
              // command exists and that permission was the only thing in the way; the
              // useful answer to an unauthorised caller is no answer at all. The
              // refusal is still recorded - in the log and the run summary, both of
              // which only people with repository access can read.
              core.warning(
                `IGNORED /auto-fix from ${who} (permission: ${perm}) on #${context.issue.number}`);
              await core.summary
                .addHeading('Ignored an unauthorised command', 3)
                .addTable([
                  [{data: 'Command', header: true}, {data: 'Commenter', header: true},
                   {data: 'Permission', header: true}, {data: 'Pull request', header: true}],
                  ['/auto-fix', who, perm || 'none', `#${context.issue.number}`],
                ])
                .write();
              core.setOutput('ok', 'false');
              return;
            }
            core.setOutput('ok', 'true');
            const pr = await github.rest.pulls.get(
              {owner, repo, pull_number: context.issue.number});
            core.setOutput('ref', pr.data.head.ref);
            core.setOutput('base_sha', pr.data.base.sha);
            core.setOutput('same_repo',
              String(pr.data.head.repo.full_name === `${owner}/${repo}`));

      - name: Refuse forks
        if: steps.auth.outputs.ok == 'true' && steps.auth.outputs.same_repo != 'true'
        run: |
          echo "Fork pull requests cannot be written to by this workflow."
          exit 1

      # The pull request's own copy of these scripts is NOT trusted. This workflow holds
      # contents:write, so running a script the pull request can edit would let anyone
      # with write access execute arbitrary code under the workflow token - an
      # escalation from "can push to a branch" to "can act as the workflow". The
      # default branch is behind branch protection, so take the executable from there.
      #
      # This must come BEFORE the pull request checkout: that checkout cleans the
      # workspace and would remove this tree, hence the copy out to /tmp.
      - name: Check out the tooling from the default branch
        if: steps.auth.outputs.ok == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .tooling

      - name: Copy the tooling out of the workspace
        if: steps.auth.outputs.ok == 'true'
        run: cp -r "$GITHUB_WORKSPACE/.tooling/scripts" /tmp/tooling

      - uses: actions/checkout@v4
        if: steps.auth.outputs.ok == 'true'
        with:
          ref: ${{ steps.auth.outputs.ref }}
          fetch-depth: 0

      - name: Apply the fix
        if: steps.auth.outputs.ok == 'true'
        id: fix
        run: |
          python3 /tmp/tooling/licence-gate.py --fix \
            "${{ steps.auth.outputs.base_sha }}" HEAD > /tmp/fixed.txt
          echo "count=$(wc -l < /tmp/fixed.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"
          cat /tmp/fixed.txt

      - name: Commit and push
        if: steps.auth.outputs.ok == 'true' && steps.fix.outputs.count != '0'
        env:
          TRIGGERED_BY: ${{ github.event.comment.user.login }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          {
            echo "chore(license): add modification notices"
            echo
            echo "Applied mechanically on request. Each notice is appended to an"
            echo "existing header block; no existing licence text, copyright line"
            echo "or SPDX tag is altered."
            echo
            echo "Requested-by: ${TRIGGERED_BY}"
          } > /tmp/commit-msg.txt
          git commit -s -F /tmp/commit-msg.txt
          git push origin "HEAD:${{ steps.auth.outputs.ref }}"

      - name: Report
        if: steps.auth.outputs.ok == 'true'
        uses: actions/github-script@v7
        env:
          COUNT: ${{ steps.fix.outputs.count }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const n = process.env.COUNT;
            const body = n === '0'
              ? 'Nothing to auto-fix — no modified file is missing its notice.'
              : `Applied the modification notice to ${n} file(s). Nothing existing was altered.\n\nNew files and altered licence lines are **not** auto-fixed; those need a human.`;
            await github.rest.issues.createComment(
              {owner, repo, issue_number: context.issue.number, body});
