name: Tests

# The gate's own logic is tested. A verification tool nobody verifies is just a
# confident opinion.

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate every workflow parses
        run: |
          python3 - <<'PY'
          import glob, sys, yaml
          bad = 0
          for f in glob.glob(".github/workflows/*.yml"):
              try:
                  yaml.safe_load(open(f))
                  print(f"ok     {f}")
              except Exception as e:
                  print(f"BROKEN {f}: {str(e).splitlines()[0]}")
                  bad = 1
          sys.exit(bad)
          PY
      - name: Unit tests
        working-directory: scripts
        run: python3 -m unittest discover -p 'test_*.py' -v
